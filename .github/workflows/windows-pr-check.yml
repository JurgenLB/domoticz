name: PR Check (Windows)

concurrency:
  group: windows-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - development
      - master
    paths-ignore:
      - 'tools/**'
      - '**.md'
      - '**.txt'

jobs:
  windows:
    runs-on: windows-2022

    if: github.repository == 'domoticz/domoticz'

    env:
      CONFIGURATION: Release
      PLATFORM: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3

      - name: Download WindowsLibraries
        shell: powershell
        run: |
          cd msbuild
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/domoticz/win32-libraries/master/WindowsLibraries.7z" `
            -OutFile "WindowsLibraries.7z"
          7z x WindowsLibraries.7z | Out-Null
          cd ..

      - name: Fix jwt-cpp MSVC C4244 warnings
        shell: powershell
        run: |
          # Fix traits.h: use Int64 instead of Int to avoid C4244 narrowing conversion warning
          $traitsFile = "msbuild\Windows Libraries\include\jwt-cpp\traits\open-source-parsers-jsoncpp\traits.h"
          if (Test-Path $traitsFile) {
            $content = [System.IO.File]::ReadAllText($traitsFile)
            $content = $content -replace 'using integer_type = Json::Value::Int;', 'using integer_type = Json::Value::Int64;'
            [System.IO.File]::WriteAllText($traitsFile, $content)
          }
          # Fix jwt.h: explicit cast in as_date() to avoid C4244 double-to-__time64_t conversion warning
          $jwtFile = "msbuild\Windows Libraries\include\jwt-cpp\jwt.h"
          if (Test-Path $jwtFile) {
            $content = [System.IO.File]::ReadAllText($jwtFile)
            $content = $content -replace 'return system_clock::from_time_t\(std::round\(as_number\(\)\)\);', 'return system_clock::from_time_t(static_cast<std::time_t>(std::round(as_number())));'
            [System.IO.File]::WriteAllText($jwtFile, $content)
          }

      - name: Configure libwebem build paths
        shell: powershell
        run: |
          $propsContent = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>${{ github.workspace }}\msbuild\Windows Libraries\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          "@
          $propsContent | Out-File -FilePath "extern\libwebem\Directory.Build.props" -Encoding utf8

      - name: Build Domoticz
        shell: cmd
        run: msbuild msbuild\domoticz.sln /m /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /verbosity:minimal
