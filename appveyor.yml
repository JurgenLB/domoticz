version: 1.0.{build}
image: Visual Studio 2022
configuration: Release
platform: x86

build: off

clone_script:
- ps: |
    Write-Host "Cloning $env:APPVEYOR_REPO_NAME branch $env:APPVEYOR_REPO_BRANCH ..."
    git clone -q --branch $env:APPVEYOR_REPO_BRANCH https://github.com/$env:APPVEYOR_REPO_NAME.git $env:APPVEYOR_BUILD_FOLDER
    Set-Location $env:APPVEYOR_BUILD_FOLDER
    git checkout -qf $env:APPVEYOR_REPO_COMMIT
    Write-Host "Initialising required submodules ..."
    git submodule update --init -- extern/libwebem extern/jwtcpp
    if ($LASTEXITCODE -ne 0) {
      Write-Error "git submodule update failed (exit $LASTEXITCODE)"
      exit 1
    }
    if (-not (Test-Path "extern\libwebem\webem.vcxproj")) {
      Write-Error "webem.vcxproj not found after submodule init"
      Get-ChildItem "extern" -ErrorAction SilentlyContinue
      exit 1
    }
    Write-Host "Clone complete - extern\libwebem\webem.vcxproj present"

before_build:
- ps: nuget install Tools.InnoSetup
- ps: |
    Set-Location msbuild
    Invoke-WebRequest `
      -Uri "https://raw.githubusercontent.com/domoticz/win32-libraries/master/WindowsLibraries.7z" `
      -OutFile "WindowsLibraries.7z"
    & 7z x WindowsLibraries.7z | Out-Null
    if ($LASTEXITCODE -ne 0) {
      Write-Error "7z extraction failed (exit $LASTEXITCODE)"
      exit 1
    }
    Set-Location ..
- ps: |
    $jwtDir    = Join-Path $env:APPVEYOR_BUILD_FOLDER "extern\jwtcpp\include"
    $winLibDir = Join-Path $env:APPVEYOR_BUILD_FOLDER "msbuild\Windows Libraries\include"
    $propsContent = @"
    <Project>
      <ItemDefinitionGroup>
        <ClCompile>
          <AdditionalIncludeDirectories>$jwtDir;$winLibDir;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
        </ClCompile>
      </ItemDefinitionGroup>
    </Project>
    "@
    $propsContent | Out-File -FilePath "extern\libwebem\Directory.Build.props" -Encoding utf8

build_script:
- cmd: msbuild msbuild\domoticz.sln /m /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM% /verbosity:minimal

after_build:
- cmd: |
    copy appversion.h version_windows_x86.h
    copy History.txt history_windows_x86.txt
    move Tools.InnoSetup.* Tools.InnoSetup
    Tools.InnoSetup\tools\ISCC msbuild\WindowsInstaller\DomoticzSetup.iss
    msbuild msbuild\package.proj

artifacts:
- path: domoticz_windows_x86.zip
- path: version_windows_x86.h
- path: history_windows_x86.txt
- path: History.txt

test: off
