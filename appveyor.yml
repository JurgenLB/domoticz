version: 1.0.{build}
image: Visual Studio 2019
configuration: Release
platform: x86

# Replace the default clone with our own so the branch/commit are correct.
# All dependency setup (Windows Libraries download, submodule init, webem build)
# is handled by msbuild/Directory.Build.targets which runs inside MSBuild before
# the first ClCompile task — this works regardless of when AppVeyor triggers
# its auto-msbuild relative to YAML lifecycle scripts.
clone_script:
- cmd: git clone -q --branch=%APPVEYOR_REPO_BRANCH% https://github.com/%APPVEYOR_REPO_NAME%.git %APPVEYOR_BUILD_FOLDER%
- cmd: cd %APPVEYOR_BUILD_FOLDER% && git checkout -qf %APPVEYOR_REPO_COMMIT%

test: off
